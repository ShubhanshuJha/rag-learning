<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Omnivore — RAG over any document</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">&#9670;</span>
        <span class="brand__name">Omnivore</span>
        <span class="brand__sub">any document, cited</span>
      </div>

      <div class="topbar__right">
        <div class="status" id="status" role="status">
          <span class="status__dot" id="statusDot"></span>
          <span id="statusText" class="status__text">connecting&hellip;</span>
        </div>
        <button class="reset-btn" id="resetBtn" title="Clear session" aria-label="Clear session">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M1 3.5H13M5 1H9M2.5 3.5L3.2 12C3.24 12.55 3.7 13 4.25 13H9.75C10.3 13 10.76 12.55 10.8 12L11.5 3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="log" id="log">
      <div class="empty-state" id="emptyState">
        <p class="empty-state__eyebrow">NO QUERIES YET</p>
        <p class="empty-state__body">
          Feed it PDFs, documents, spreadsheets, or plain text — then ask anything.
          Every retrieved source traces alongside the answer below.
        </p>
      </div>
    </main>

    <footer class="composer">
      <span class="composer__prompt" aria-hidden="true">&#10095;</span>
      <input
        type="text"
        id="queryInput"
        class="composer__input"
        placeholder="Ask your documents something…"
        autocomplete="off"
        spellcheck="false"
      >
      <button id="sendBtn" class="composer__send" aria-label="Send query">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
          <path d="M1 8L15 1L9 15L7 9L1 8Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
      </button>
    </footer>

  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
